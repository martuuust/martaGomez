<!doctype html>
<html lang="es" class="dark">
<head>
  <meta charset="utf-8">
  <title>Marta Gómez — Frontend Developer & UI/UX Designer</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta
    name="description"
    content="Portfolio de Marta Gómez. Desarrolladora Frontend y Diseñadora UI/UX especializada en Angular, interfaces dinámicas y experiencias de usuario impecables."
  />
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
    rel="stylesheet"
  />
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('portfolio-theme');
        var theme = stored === 'light' || stored === 'dark'
          ? stored
          : 'dark';
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.style.colorScheme = theme;
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
