<section
  id="inicio"
  class="relative flex min-h-screen flex-col overflow-hidden pt-28 pb-16"
>
  <canvas
    #particles
    class="absolute inset-0 -z-10 h-full w-full"
    aria-hidden="true"
  ></canvas>

  <div class="hero-blob absolute -top-32 -left-32 -z-10 h-96 w-96 rounded-full bg-primary/30 blur-[110px] animate-blob"></div>
  <div
    class="hero-blob absolute -right-40 top-24 -z-10 h-[26rem] w-[26rem] rounded-full bg-secondary/25 blur-[120px] animate-blob-slow"
  ></div>
  <div
    class="hero-blob absolute bottom-0 left-1/3 -z-10 h-80 w-80 rounded-full bg-primary/15 blur-[100px] animate-blob"
    style="animation-delay: -8s"
  ></div>

  <div class="bg-grid absolute inset-0 -z-10" aria-hidden="true"></div>

  <main
    class="mx-auto flex w-full max-w-6xl flex-1 flex-col items-center justify-center px-5 text-center sm:px-8"
  >
    <span
      class="hero-badge glass inline-flex items-center gap-2.5 rounded-full px-4 py-1.5 text-xs font-medium sm:text-sm"
    >
      <span
        class="h-2 w-2 rounded-full bg-emerald-500"
        style="--dot-color: rgba(16, 185, 129, 0.5); animation: pulse-dot 2s ease-in-out infinite"
      ></span>
      Disponible para nuevos proyectos
      <span class="text-ink-muted">· {{ person.location }}</span>
    </span>

    <h1
      class="mt-8 font-display text-[2.6rem] leading-[1.06] font-bold tracking-tight sm:text-6xl lg:text-7xl"
    >
      <span #headlineA class="block">Diseño y construyo</span>
      <span #headlineB class="block pb-1">experiencias que emocionan.</span>
    </h1>

    <p class="hero-role-line mt-6 font-display text-lg font-medium sm:text-2xl">
      <span class="text-ink-muted">Soy </span>
      <span class="text-primary">{{ person.name }}</span>
      <span class="text-ink-muted"> — </span>
      <span #roleLine class="inline-block text-gradient">
        {{ roles[roleIndex()] }}
      </span>
    </p>

    <p class="hero-sub mt-5 max-w-2xl text-sm leading-relaxed text-ink-muted sm:text-base">
      {{ person.role }} especializada en Angular. Convierto ideas complejas en
      interfaces rápidas, accesibles y memorables.
    </p>

    <div class="mt-10 flex flex-col items-center gap-3 sm:flex-row sm:gap-4">
      <a
        appGsapHover
        href="#proyectos"
        class="hero-cta group inline-flex items-center gap-2 rounded-full bg-gradient-to-r from-primary to-secondary px-7 py-3.5 text-sm font-semibold text-white shadow-lg transition-shadow hover:shadow-xl glow-primary"
        (click)="scrollService.scrollToSection('proyectos'); $event.preventDefault()"
      >
        Ver proyectos
        <svg
          class="h-4 w-4 transition-transform group-hover:translate-x-1"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M5 12h14m-6-6 6 6-6 6"></path>
        </svg>
      </a>
      <a
        appGsapHover
        href="#contacto"
        class="hero-cta inline-flex items-center gap-2 rounded-full border border-line bg-surface/50 px-7 py-3.5 text-sm font-semibold text-ink backdrop-blur transition-colors hover:border-primary/50 hover:text-primary"
        (click)="scrollService.scrollToSection('contacto'); $event.preventDefault()"
      >
        Contactar
      </a>
    </div>
  </main>

  <button
    type="button"
    class="hero-scroll mx-auto mt-10 flex flex-col items-center gap-2 text-ink-muted transition-colors hover:text-primary"
    (click)="scrollService.scrollToSection('sobre-mi')"
    aria-label="Bajar a la sección sobre mí"
  >
    <span class="text-[11px] tracking-[0.2em] uppercase">Scroll</span>
    <svg
      class="h-5 w-5 animate-bounce-soft"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M12 5v14m-6-6 6 6 6-6"></path>
    </svg>
  </button>
</section>
