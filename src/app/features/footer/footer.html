<footer class="relative overflow-hidden border-t border-line">
  <div
    class="absolute inset-x-0 -top-20 mx-auto h-40 w-2/3 rounded-full bg-primary/10 blur-[90px]"
    aria-hidden="true"
  ></div>

  <div class="mx-auto flex max-w-6xl flex-col items-center gap-6 px-5 py-14 text-center sm:px-8">
    <span
      class="relative grid h-14 w-14 place-items-center"
      aria-hidden="true"
    >
      <span
        class="absolute inset-0 animate-spin-slow rounded-full"
        style="
          background: conic-gradient(
            from 0deg,
            transparent 0%,
            var(--primary) 30%,
            var(--secondary) 55%,
            transparent 80%
          );
        "
      ></span>
      <span class="absolute inset-[2px] rounded-full bg-base"></span>
      <span class="relative font-display text-base font-bold text-gradient">MG</span>
    </span>

    <p class="max-w-md text-sm leading-relaxed text-ink-muted">
      Hecho con <span class="text-primary">Angular 21</span>, Tailwind CSS y
      GSAP. Código limpio, animaciones con intención y un café de por medio.
    </p>

    <p class="text-xs text-ink-muted">
      © {{ year }} {{ person.name }} — Todos los derechos reservados.
    </p>
  </div>

  <button
    type="button"
    (click)="scrollService.scrollToTop()"
    [attr.aria-label]="'Volver arriba'"
    class="fixed right-5 bottom-5 z-40 grid h-12 w-12 place-items-center rounded-full bg-gradient-to-br from-primary to-secondary text-white shadow-xl transition-all duration-500"
    [class]="
      showTop()
        ? 'translate-y-0 opacity-100'
        : 'pointer-events-none translate-y-4 opacity-0'
    "
  >
    <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="m18 15-6-6-6 6"></path>
    </svg>
  </button>
</footer>
