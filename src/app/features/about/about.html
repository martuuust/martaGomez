<section
  id="sobre-mi"
  class="relative mx-auto max-w-6xl scroll-mt-24 px-5 py-20 sm:px-8 sm:py-28"
>
  <div
    class="absolute top-20 right-0 -z-10 h-72 w-72 rounded-full bg-primary/10 blur-[100px]"
    aria-hidden="true"
  ></div>

  <header class="max-w-2xl" appGsapReveal>
    <span class="font-display text-xs font-semibold tracking-[0.25em] text-primary uppercase">
      Sobre mí
    </span>
    <h2 class="mt-3 font-display text-3xl font-bold tracking-tight text-ink sm:text-5xl">
      Mi travesía <span class="text-gradient">profesional</span>
    </h2>
  </header>

  <div class="mt-12 max-w-3xl" appGsapReveal>
    <div class="space-y-4 text-base leading-relaxed text-ink-muted sm:text-lg">
      @for (paragraph of person.bio; track paragraph) {
        <p>{{ paragraph }}</p>
      }
    </div>
  </div>

  <div class="mt-16 sm:mt-20">
    <div class="flex flex-wrap items-end justify-between gap-3" appGsapReveal>
      <h3 class="font-display text-xl font-semibold text-ink sm:text-2xl">Experiencia</h3>
      <p class="text-xs text-ink-muted">
        Haz clic en <span class="font-semibold text-primary">▼</span> para ver logros y fragmentos
      </p>
    </div>

    <div class="mt-10">
      <app-timeline [entries]="experience" title="Experiencia"></app-timeline>
    </div>
  </div>

  <div class="mt-16 sm:mt-20">
    <div class="flex flex-wrap items-end justify-between gap-3" appGsapReveal>
      <h3 class="font-display text-xl font-semibold text-ink sm:text-2xl">Formación</h3>
      <p class="text-xs text-ink-muted">
        Proyectos académicos reales · ampliación autodidacta
      </p>
    </div>

    <div class="mt-10">
      <app-timeline [entries]="education" title="Formación"></app-timeline>
    </div>
  </div>
</section>
