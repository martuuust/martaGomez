<!doctype html>
<html lang="es" class="dark">
<head>
  <meta charset="utf-8">
  <title>Marta Gómez — Desarrolladora Web</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta
    name="description"
    content="Portfolio de Marta Gómez, desarrolladora web. Angular, PHP, Express y SQL. Chiva, Valencia."
  />
  <meta name="author" content="Marta Gómez" />
  <meta name="theme-color" content="#0f0b18" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f8f6fc" media="(prefers-color-scheme: light)" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="es_ES" />
  <meta property="og:site_name" content="Marta Gómez" />
  <meta property="og:title" content="Marta Gómez — Desarrolladora Web" />
  <meta
    property="og:description"
    content="Portfolio de Marta Gómez. Angular, PHP, Express y SQL. Casos de estudio y stack real."
  />
  <!-- TODO(Marta): sustituye public/og-image.png (1200×630) por tu imagen de preview -->
  <meta property="og:image" content="/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Marta Gómez — Desarrolladora Web" />

    name="twitter:description"
    content="Portfolio de Marta Gómez. Angular, PHP, Express y SQL. Casos de estudio y stack real."
  />

  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
    rel="stylesheet"
  />
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('portfolio-theme');
        var theme = stored === 'light' || stored === 'dark'
          ? stored
          : 'dark';
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.style.colorScheme = theme;
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
